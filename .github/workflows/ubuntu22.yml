name: Ubuntu 22.04

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - dev

jobs:
  ci:
    name: ${{ matrix.compiler }}-${{ matrix.manager }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      cache-name: cache-${{ matrix.compiler }}-${{ matrix.manager }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: include_file_mtime,pch_defines,time_macros
      CCACHE_MAXSIZE: 384M
    strategy:
      fail-fast: false # Keep matrix jobs running so failures are easier to inspect
      matrix:
        include:
          - { compiler: gcc,   manager: cmake, asan: false, coverage: false }
          - { compiler: gcc,   manager: conan, asan: false, coverage: false }
          - { compiler: clang, manager: cmake, asan: true,  coverage: false }
          - { compiler: clang, manager: conan, asan: false, coverage: false }

    steps:
      - uses: actions/checkout@v6.0.1
      - uses: lukka/get-cmake@v4.2.0
      - name: Setup Python
        uses: actions/setup-python@v6.1.0
        if: matrix.manager == 'conan'
        with:
          python-version: '3.x'

      - name: Update apt
        run: |
          sudo apt-get update

      - name: Prepare cache directories
        run: |
          mkdir -p "$CCACHE_DIR" ~/.conan2 install/github-actions-${{ matrix.manager }}

      - name: Setup ccache + dependency-provider cache
        uses: actions/cache@v4.2.0
        if: matrix.manager == 'cmake'
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            install/github-actions-${{ matrix.manager }}
          key: ${{ github.workflow }}-${{ env.cache-name }}

      - name: Setup ccache + conan cache
        uses: actions/cache@v4.2.0
        if: matrix.manager == 'conan'
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ~/.conan2
          key: ${{ github.workflow }}-${{ env.cache-name }}

      - name: Setup gcc
        if: matrix.compiler == 'gcc'
        run: |
          sudo apt-get install gcc-12 g++-12 -y
          echo "FC=gfortran-12" >> $GITHUB_ENV
          echo "CC=gcc-12"      >> $GITHUB_ENV
          echo "CXX=g++-12"     >> $GITHUB_ENV

      - name: Setup clang
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get install clang-15 libomp-15-dev -y
          echo "FC=gfortran-12" >> $GITHUB_ENV
          echo "CC=clang-15"    >> $GITHUB_ENV
          echo "CXX=clang++-15" >> $GITHUB_ENV

      - name: Setup build tools
        run: |
          sudo apt-get install ccache ninja-build gcovr lcov -y
          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=${CCACHE_MAXSIZE}
          ccache --show-config

      - name: Setup conan
        if: matrix.manager == 'conan'
        run: |
          pip install conan
          conan profile detect --force

      - name: Run CMakePreset
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'github-actions-${{ matrix.manager }}'
          configurePresetAdditionalArgs: "['-DH5PP_ENABLE_COVERAGE=${{ matrix.coverage && 'TRUE' || 'FALSE' }}','-DH5PP_ENABLE_ASAN=${{ matrix.asan && 'TRUE' || 'FALSE' }}']"
          buildPreset: 'github-actions-${{ matrix.manager }}'
          testPreset: 'github-actions-${{ matrix.manager }}'

      - name: Show ccache stats
        run: ccache --show-stats
