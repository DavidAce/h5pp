name: Windows 2025

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - dev
      - v2

jobs:
  ci:
    name: ${{ matrix.compiler }}-${{ matrix.manager }}
    runs-on: windows-2025
    # The longest healthy job took 58 minutes; allow twice that, rounded up.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      cache-name: cache-${{ matrix.compiler }}-${{ matrix.manager }}
      H5PP_CMAKE_PRESET: ${{ format('github-actions-windows-pkg-{0}', matrix.manager) }}
      CFLAGS: /W3
      CXXFLAGS: /W3
    strategy:
      fail-fast: false # Keep matrix jobs running so failures are easier to inspect
      matrix:
        include:
          - { compiler: cl, manager: conan, asan: false }
          - { compiler: cl, manager: cmake, asan: false }

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: lukka/get-cmake@v4.4.5
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        if: contains(matrix.manager, 'conan')
        with:
          python-version: '3.x'

      - name: Prepare cache directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$HOME\\.conan2" | Out-Null
          New-Item -ItemType Directory -Force -Path "install/${{ env.H5PP_CMAKE_PRESET }}" | Out-Null

      # Recipes, build settings, and the runner image must match before restoring dependencies.
      - name: Choose cache key
        id: cache-environment
        env:
          CACHE_INPUT_HASH: ${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'conanfile.py', 'cmake/**', '.github/workflows/windows2025.yml') }}
          CACHE_WORKFLOW: ${{ github.workflow }}
          CACHE_JOB: ${{ env.cache-name }}
        shell: pwsh
        run: '"prefix=h5pp-${env:CACHE_WORKFLOW}-${env:RUNNER_OS}-${env:RUNNER_ARCH}-${env:ImageOS}-${env:ImageVersion}-${env:CACHE_JOB}-${env:CACHE_INPUT_HASH}" >> $env:GITHUB_OUTPUT'

      - name: Setup caches
        id: h5pp-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.conan2
            install/${{ env.H5PP_CMAKE_PRESET }}
          key: ${{ steps.cache-environment.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.cache-environment.outputs.prefix }}-

      - name: Setup conan
        if: matrix.manager == 'conan'
        run: |
          pip install conan
          conan profile detect --force

      - name: Run CMakePreset
        uses: lukka/run-cmake@v10.9
        with:
          configurePreset: '${{ env.H5PP_CMAKE_PRESET }}'
          # Conan libraries lack MSVC's STL annotations. Keep ASan enabled, but
          # disable those extra checks so the examples and tests can link to them.
          configurePresetAdditionalArgs: >-
            ['-DH5PP_ENABLE_ASAN=${{ matrix.asan && 'TRUE' || 'FALSE' }}'
            ${{ matrix.manager == 'conan' && matrix.asan && ', "-DCMAKE_CXX_FLAGS:STRING=/D_DISABLE_STL_ANNOTATION"' || '' }}]
          buildPreset: '${{ env.H5PP_CMAKE_PRESET }}'
          buildPresetAdditionalArgs: "['--config Debug']"

      - name: Run tests
        shell: pwsh
        run: ctest --preset "$env:H5PP_CMAKE_PRESET" --timeout 600
