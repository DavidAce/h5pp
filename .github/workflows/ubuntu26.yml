name: Ubuntu 26.04

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - dev
      - v2

jobs:
  ci:
    name: ${{ matrix.compiler }}-${{ matrix.manager }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    env:
      cache-name: cache-${{ matrix.compiler }}-${{ matrix.manager }}
      H5PP_CMAKE_PRESET: ${{ matrix.manager == 'find' && 'github-actions-find' || format('github-actions-pkg-{0}', matrix.manager) }}
      CFLAGS: -Wall -Wextra -Wpedantic -Wconversion -Wunused
      CXXFLAGS: -Wall -Wextra -Wpedantic -Wconversion -Wunused
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: include_file_mtime,pch_defines,time_macros
      CCACHE_MAXSIZE: 384M
    strategy:
      fail-fast: false # Keep matrix jobs running so failures are easier to inspect
      matrix:
        include:
          - { compiler: gcc,   manager: cmake, asan: false, coverage: false }
          - { compiler: gcc,   manager: conan, asan: false, coverage: false }
          - { compiler: gcc,   manager: find,  asan: false, coverage: true  }
          - { compiler: clang, manager: cmake, asan: true,  coverage: false }
          - { compiler: clang, manager: conan, asan: false, coverage: false }

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: lukka/get-cmake@v4.4.5
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        if: matrix.manager == 'conan'
        with:
          python-version: '3.x'

      - name: Update apt
        run: |
          sudo apt-get update

      - name: Prepare cache directories
        run: |
          mkdir -p "$CCACHE_DIR" ~/.conan2 install/${{ env.H5PP_CMAKE_PRESET }}

      # Recipes, build settings, and the runner image must match before restoring dependencies.
      - name: Choose cache key
        id: cache-environment
        env:
          CACHE_INPUT_HASH: ${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'conanfile.py', 'cmake/**', '.github/workflows/ubuntu26.yml') }}
          CACHE_WORKFLOW: ${{ github.workflow }}
          CACHE_JOB: ${{ env.cache-name }}
        run: echo "prefix=h5pp-${CACHE_WORKFLOW}-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS}-${ImageVersion}-${CACHE_JOB}-${CACHE_INPUT_HASH}" >> "$GITHUB_OUTPUT"

      - name: Setup ccache + dependency-provider cache
        uses: actions/cache@v6.1.0
        if: matrix.manager == 'cmake'
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            install/${{ env.H5PP_CMAKE_PRESET }}
          key: ${{ steps.cache-environment.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.cache-environment.outputs.prefix }}-

      - name: Setup ccache + conan cache
        uses: actions/cache@v6.1.0
        if: matrix.manager == 'conan'
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ~/.conan2
          key: ${{ steps.cache-environment.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.cache-environment.outputs.prefix }}-

      - name: Setup ccache cache
        uses: actions/cache@v6.1.0
        if: matrix.manager == 'find'
        with:
          path: |
            ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-environment.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.cache-environment.outputs.prefix }}-

      - name: Setup gcc
        if: matrix.compiler == 'gcc'
        run: |
          sudo apt-get install gcc-15 g++-15 gfortran-15 -y
          echo "FC=gfortran-15" >> $GITHUB_ENV
          echo "CC=gcc-15"      >> $GITHUB_ENV
          echo "CXX=g++-15"     >> $GITHUB_ENV

      - name: Setup clang
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get install clang-22 libomp-22-dev -y
          echo "FC=gfortran-15" >> $GITHUB_ENV
          echo "CC=clang-22"    >> $GITHUB_ENV
          echo "CXX=clang++-22" >> $GITHUB_ENV

      - name: Setup build tools
        run: |
          sudo apt-get install ccache ninja-build gcovr lcov -y
          echo "CMAKE_GENERATOR=Ninja Multi-Config" >> $GITHUB_ENV

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=${CCACHE_MAXSIZE}
          ccache --show-config

      - name: Setup apt packages (dependencies)
        if: matrix.manager == 'find'
        run: sudo apt-get install libhdf5-dev libaec-dev libfmt-dev libspdlog-dev libeigen3-dev catch2 -y

      - name: Setup conan
        if: matrix.manager == 'conan'
        run: |
          pip install conan
          conan profile detect --force

      - name: Run CMakePreset
        uses: lukka/run-cmake@v10.9
        with:
          configurePreset: '${{ env.H5PP_CMAKE_PRESET }}'
          configurePresetAdditionalArgs: "['-DH5PP_ENABLE_COVERAGE=${{ matrix.coverage && 'TRUE' || 'FALSE' }}','-DH5PP_ENABLE_ASAN=${{ matrix.asan && 'TRUE' || 'FALSE' }}']"
          buildPreset: '${{ env.H5PP_CMAKE_PRESET }}'

      - name: Install h5pp
        run: cmake --install "build/${H5PP_CMAKE_PRESET}" --config Debug

      - name: Run tests
        run: ctest --preset "$H5PP_CMAKE_PRESET" --timeout 600 --no-tests=error

      - name: Configure installed-package test
        working-directory: tests/install/find-package
        run: |
          if [ "${{ matrix.manager }}" = "conan" ]; then
            export CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/build/${H5PP_CMAKE_PRESET}/conan/build/generators"
          fi
          cmake --preset default -Dh5pp_ROOT="${GITHUB_WORKSPACE}/install/${H5PP_CMAKE_PRESET}" -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/h5pp-consumer-install"

      - name: Build installed-package test
        working-directory: tests/install/find-package
        run: cmake --build --preset default

      - name: Install consumer executable
        working-directory: tests/install/find-package
        run: cmake --install build --config Debug

      - name: Run installed-package test
        working-directory: tests/install/find-package
        run: ctest --preset default

      - name: Show ccache stats
        run: ccache --show-stats

      - name: Generate coverage report
        if: matrix.compiler == 'gcc' && matrix.manager == 'find'
        run: |
          gcovr --gcov-executable gcov-15 --root . --filter include/ --exclude-throw-branches --exclude-unreachable-branches --lcov coverage.info --print-summary build/github-actions-find

      - name: Upload coverage to Codecov
        if: matrix.compiler == 'gcc' && matrix.manager == 'find'
        uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true
          files: coverage.info
          disable_search: true
          fail_ci_if_error: true
          verbose: true
